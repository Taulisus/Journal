{% extends "base.html" %}
{% block content %}
<h2 class="mb-3"><i class="bi bi-people-fill"></i> Профили пользователей</h2>

<div class="row">
    {% for user in users %}
    <div class="col-md-6 col-xl-4 mb-4">
        <div class="card h-100 shadow-sm">
            <div class="card-header d-flex justify-content-between align-items-center bg-light">
                <h5 class="mb-0">
                    <i class="bi bi-person-circle"></i> 
                    {{ user.full_name or 'Без имени' }}
                </h5>
                <span class="badge bg-secondary">{{ user.username }}</span>
            </div>
            <div class="card-body">
                <form method="POST" action="{{ url_for('main.save_profile', user_id=user.id) }}">
                    <div class="mb-3">
                        <label class="form-label fw-bold">ФИО</label>
                        <input type="text" class="form-control" name="full_name" 
                               value="{{ user.full_name or '' }}"
                               placeholder="Иванов Иван Иванович">
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label fw-bold">Телефон</label>
                        <input type="text" class="form-control" name="phone" 
                               value="{{ user.phone or '' }}"
                               placeholder="+7 (999) 123-45-67">
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label fw-bold">Должность</label>
                        <input type="text" class="form-control" name="position" 
                               value="{{ user.position or '' }}"
                               placeholder="Преподаватель">
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label fw-bold">Роли</label>
                        <div class="border rounded p-2">
                            {% for role in roles %}
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" 
                                       name="roles" value="{{ role.id }}"
                                       id="role_{{ user.id }}_{{ role.id }}">
                                <label class="form-check-label" for="role_{{ user.id }}_{{ role.id }}">
                                    {{ role.name }}
                                    <small class="text-muted">({{ role.code }})</small>
                                </label>
                            </div>
                            {% endfor %}
                        </div>
                    </div>
                    
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-save"></i> Сохранить профиль
                        </button>
                        <a href="{{ url_for('main.assign_journals', user_id=user.id) }}" 
                           class="btn btn-outline-info">
                            <i class="bi bi-journal-bookmark"></i> Назначить журналы
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
    {% endfor %}
</div>

{% if not users %}
<div class="text-center py-5">
    <i class="bi bi-people" style="font-size: 3rem; color: #ccc;"></i>
    <p class="text-muted mt-2">Нет пользователей</p>
</div>
{% endif %}
{% endblock %}
