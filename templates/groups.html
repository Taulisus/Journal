{% extends "base.html" %}
{% block content %}
<h2 class="mb-3"><i class="bi bi-people-fill"></i> Группы</h2>
<div class="row">
    <div class="col-md-4 mb-3">
        <div class="card">
            <div class="card-header"><h5 class="mb-0">Добавить группу</h5></div>
            <div class="card-body">
                <form method="POST" action="{{ url_for('main.add_group') }}">
                    <div class="mb-3"><label class="form-label">Название</label><input type="text" class="form-control no-emoji" name="name" required></div>
                    <button type="submit" class="btn btn-primary w-100"><i class="bi bi-plus-circle"></i> Добавить</button>
                </form>
            </div>
        </div>
    </div>
    <div class="col-md-8">
        <div class="card">
            <div class="card-header"><h5 class="mb-0">Список групп <span class="badge bg-primary">{{ groups|length }}</span></h5></div>
            <div class="card-body p-0">
                {% if groups %}
                <table class="table table-hover mb-0">
                    <thead class="table-light"><tr><th>ID</th><th>Название</th><th>Действия</th></tr></thead>
                    <tbody>
                        {% for g in groups %}
                        <tr>
                            <td>{{ g.id }}</td><td>{{ g.name }}</td>
                            <td>
                                <button class="btn btn-sm btn-outline-primary edit-btn" data-id="{{ g.id }}" data-name="{{ g.name }}" data-bs-toggle="modal" data-bs-target="#editModal"><i class="bi bi-pencil"></i></button>
                                <a href="{{ url_for('main.delete_group', gid=g.id) }}" class="btn btn-sm btn-outline-danger" onclick="return confirm('Удалить группу {{ g.name }}?')"><i class="bi bi-trash"></i></a>
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
                {% else %}<div class="text-center py-4 text-muted">Нет групп</div>{% endif %}
            </div>
        </div>
    </div>
</div>
<div class="modal fade" id="editModal" tabindex="-1">
    <div class="modal-dialog"><div class="modal-content">
        <form method="POST" id="editForm">
            <div class="modal-header"><h5 class="modal-title">Редактировать</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
            <div class="modal-body"><input type="text" class="form-control no-emoji" name="name" id="edit_name" required></div>
            <div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button><button type="submit" class="btn btn-primary">Сохранить</button></div>
        </form>
    </div></div>
</div>
{% endblock %}
{% block scripts %}
<script>
document.querySelectorAll('.edit-btn').forEach(btn => {
    btn.addEventListener('click', function() {
        document.getElementById('edit_name').value = this.dataset.name;
        document.getElementById('editForm').action = '/groups/edit/' + this.dataset.id;
    });
});
</script>
{% endblock %}
